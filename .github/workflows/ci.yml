name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build web, CrazyGames and GameDistribution
        run: |
          npm run build
          npm run build:crazygames
          npm run build:gd
      - name: Build self-check (single file, size, no external links, no other portal's SDK)
        run: |
          node scripts/check-build.mjs web
          node scripts/check-build.mjs crazygames
          node scripts/check-build.mjs gd
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (web, CrazyGames, GameDistribution builds; desktop + phone portrait)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Build CrazyGames and GameDistribution zips
        run: |
          npm run zip
          node scripts/zip-dist.mjs dist-gd stick-duel-gd.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stick-duel-crazygames
          path: stick-duel-crazygames.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: stick-duel-gd
          path: stick-duel-gd.zip
          retention-days: 30
