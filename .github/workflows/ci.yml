name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (physics, levels, AI, every language has every English key, platform adapters)
        run: npm test
      - name: Build web, CrazyGames and GameDistribution
        run: |
          npm run build
          npm run build:crazygames
          npm run build:gd
      - name: Build self-check (single file, < 8 MB, no external links, no other portal's SDK)
        run: |
          node scripts/check-build.mjs web
          node scripts/check-build.mjs crazygames
          node scripts/check-build.mjs gd
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (web, CrazyGames, GameDistribution builds; desktop + phone portrait)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Build CrazyGames and GameDistribution zips
        run: |
          npm run zip
          node scripts/zip-dist.mjs dist-gd topple-duel-gd.zip
      - uses: actions/upload-artifact@v4
        with:
          name: topple-duel-web
          path: dist/index.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: topple-duel-crazygames
          path: topple-duel-crazygames.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: topple-duel-gd
          path: topple-duel-gd.zip
          retention-days: 30

  levels:
    # one job per world, in parallel: real duels played by the checker bots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        world: [forest, castle, mountains, desert, frozen, volcano]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Level checker (${{ matrix.world }}; the sharp bot wins, traps never do more than 80 in one shot, winning duels last 4+ shots)
        run: npx vitest run -c vitest.levels.config.ts tests/levels/${{ matrix.world }}.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levels-${{ matrix.world }}
          path: .levels/${{ matrix.world }}.json
          include-hidden-files: true
          retention-days: 7

  levels-report:
    # all 54 levels together: builds docs/levels-report.md and fails if any level failed or is missing
    needs: levels
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: levels-*
          path: .levels
          merge-multiple: true
      - run: node scripts/levels-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levels-report
          path: |
            docs/levels-report.md
            docs/levels-report.json
          retention-days: 30

  gamepix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build GamePix
        run: npm run build:gamepix
      - name: Build self-check (single file, size, GamePix SDK only)
        run: node scripts/check-build.mjs gamepix
      - name: Pack and check the GamePix zip (index.html at the root, gamepix.sdk.js, no other portal, no other URL)
        run: |
          node scripts/zip-dist.mjs dist-gamepix topple-duel-gamepix.zip
          node scripts/check-gamepix-zip.mjs topple-duel-gamepix.zip
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (GamePix build, mock SDK; desktop + phone portrait)
        run: npm run test:e2e:gamepix
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-gamepix
          path: playwright-report-gamepix/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: topple-duel-gamepix
          path: topple-duel-gamepix.zip
          retention-days: 30
