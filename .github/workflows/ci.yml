name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build web, CrazyGames and GameDistribution
        run: |
          npm run build
          npm run build:crazygames
          npm run build:gd
      - name: Build self-check (single file, size, no external links, no other portal's SDK)
        run: |
          node scripts/check-build.mjs web
          node scripts/check-build.mjs crazygames
          node scripts/check-build.mjs gd
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (web, CrazyGames, GameDistribution builds; desktop + phone portrait)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Build CrazyGames and GameDistribution zips
        run: |
          npm run zip
          node scripts/zip-dist.mjs dist-gd stick-duel-gd.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stick-duel-crazygames
          path: stick-duel-crazygames.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: stick-duel-gd
          path: stick-duel-gd.zip
          retention-days: 30

  gamepix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build GamePix
        run: npm run build:gamepix
      - name: Build self-check (single file, size, GamePix SDK only)
        run: node scripts/check-build.mjs gamepix
      - name: Pack and check the GamePix zip (index.html at the root, gamepix.sdk.js, no other portal, no other URL)
        run: |
          node scripts/submission-gamepix.mjs
          node scripts/check-gamepix-zip.mjs submission-gamepix/stick-duel-gamepix-v1.zip
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (GamePix build, mock SDK; desktop + phone portrait)
        run: npm run test:e2e:gamepix
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-gamepix
          path: playwright-report-gamepix/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stick-duel-gamepix
          path: submission-gamepix/stick-duel-gamepix-v1.zip
          retention-days: 30

  web:
    # open portals (itch.io, Newgrounds, Y8, Playgama): the ad-free web build as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Web build + zip
        run: npm run build:web && node scripts/web/zip.mjs ci-web/stick-duel-web.zip
      - name: Web zip checks (index.html at the root, no crazygames / gamedistribution / gamepix / googlesyndication, no http(s) request at runtime, iframe 640x480 / 960x600 / 1280x720 / 390x844, first level played)
        run: node scripts/web/check.mjs ci-web/stick-duel-web.zip --shots ci-web/checks
      - name: Committed zip (submission-web/stick-duel-web-v1.zip) passes the same file checks
        run: node scripts/web/check.mjs submission-web/stick-duel-web-v1.zip --static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-zip-checks
          path: ci-web/

  playgama:
    # Playgama: Playgama Bridge from Playgama's CDN, initialized before the game bundle runs, as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playgama build
        run: npm run build:playgama
      - name: Playgama build calls bridge.initialize() before the game bundle and sends the documented game_ready
        run: |
          f=dist-playgama/index.html
          head -c 400 $f | grep -qF '<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>' || { echo "$f: Bridge CDN script is not the first script in <head>"; exit 1; }
          grep -qF 'window.bridge.initialize()' $f || { echo "$f: no bridge.initialize() call"; exit 1; }
          grep -qF '<script type="text/plain" data-playgama-game>' $f || { echo "$f: game bundle not held until bridge.initialize() settles"; exit 1; }
          ! grep -q '<script type="module"' $f || { echo "$f: a module script runs before bridge.initialize() settles"; exit 1; }
          grep -qE "[\"'\`]game_ready[\"'\`]" $f || { echo "$f: no game_ready message"; exit 1; }
          grep -qF '.sendMessage(' $f || { echo "$f: no platform.sendMessage call"; exit 1; }
          grep -qF 'console.error(' $f || { echo "$f: initialize failure would be silent"; exit 1; }
          echo "OK: $f initializes Bridge first and sends game_ready"
      - name: Playgama zip checks (index.html at the root, CDN Bridge first in <head>, initialize() before the game, game_ready, no crazygames / gamedistribution / gamepix, Playgama's precheck with no FAIL / WARN)
        run: node scripts/playgama/zip.mjs ci-playgama/stick-duel-playgama.zip && node scripts/playgama/check.mjs ci-playgama/stick-duel-playgama.zip
      - name: Committed zip (submission-playgama/stick-duel-playgama-v2.zip) passes the same checks
        run: node scripts/playgama/check.mjs submission-playgama/stick-duel-playgama-v2.zip
      - name: Playgama QA Tool harness (?platform_id=qa_tool; Bridge's initialize handshake, game_ready; failures logged, game playable)
        run: |
          node scripts/playgama/qa.mjs ci-playgama/stick-duel-playgama.zip
          node scripts/playgama/qa.mjs submission-playgama/stick-duel-playgama-v2.zip
      - name: Bridge test (mock platform + stubbed Playgama SDK; interstitial, rewarded completed / cancelled, muted during ads)
        run: node scripts/playgama/test.mjs ci-playgama/stick-duel-playgama.zip
      - name: The other builds never contain Playgama Bridge
        run: |
          npm run build
          npm run build:crazygames
          npm run build:gd
          npm run build:gamepix
          npm run build:web
          for f in dist dist-crazygames dist-gd dist-gamepix dist-web; do if grep -q -e playgama-bridge -e bridge.playgama.com $f/index.html || test -e $f/playgama-bridge.js; then echo "$f has Playgama Bridge"; exit 1; fi; done
