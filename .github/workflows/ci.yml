name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build self-check (single file, size, no external links)
        run: node scripts/check-build.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test (desktop + phone portrait)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Build CrazyGames zip
        run: |
          npm run build:crazygames
          node scripts/check-build.mjs
          npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: stick-duel-crazygames
          path: stick-duel-crazygames.zip
          retention-days: 30
